##############################################################################
#  CloudPulse – BodhGanga Backend Deployment
#
#  Real app facts (derived from the actual codebase):
#    - Spring Boot 3.4.5  |  Java 17
#    - MongoDB as primary datastore
#    - Spring Security + JWT authentication
#    - AWS S3, Razorpay, Google Drive, Gemini AI integrations
#    - App port: 9090 (single port for both app traffic AND management/actuator)
#    - Micrometer + Prometheus registry: /actuator/prometheus on :9090
##############################################################################
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bodhganga-backend
  namespace: bodhganga
  labels:
    app.kubernetes.io/name: bodhganga-backend
    app.kubernetes.io/part-of: cloudpulse
    app.kubernetes.io/component: backend
    version: "1.0.0"
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port:   "9090"
    prometheus.io/path:   "/actuator/prometheus"
spec:
  # ── High Availability: 3 replicas ─────────────────────────────────────────
  replicas: 3

  selector:
    matchLabels:
      app.kubernetes.io/name: bodhganga-backend

  # ── Zero-downtime Rolling Update ──────────────────────────────────────────
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  template:
    metadata:
      labels:
        app.kubernetes.io/name: bodhganga-backend
        app.kubernetes.io/part-of: cloudpulse
        app.kubernetes.io/component: backend
        version: "1.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port:   "9090"
        prometheus.io/path:   "/actuator/prometheus"

    spec:
      # ── Spread pods across nodes to avoid single-node failures ────────────
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: bodhganga-backend

      # ── Pod-level Security Context ────────────────────────────────────────
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000

      # ── Graceful shutdown: drain in-flight requests ───────────────────────
      terminationGracePeriodSeconds: 30

      containers:
        - name: bodhganga-backend
          # Build and tag: docker build -t bodhganga-backend:1.0.0 bodhganga/backend/
          image: bodhganga-backend:1.0.0
          imagePullPolicy: IfNotPresent

          # ── Container Security ───────────────────────────────────────────
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          ports:
            # Single port for both application traffic AND /actuator/prometheus
            - name: app
              containerPort: 9090
              protocol: TCP

          # ── Environment Variables ────────────────────────────────────────
          # Sensitive values (JWT_SECRET, API keys) come from the Secret.
          # Non-sensitive config comes from the ConfigMap.
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: ENVIRONMENT
              value: "production"
            - name: PORT
              value: "9090"
            # MongoDB URI from Secret
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: bodhganga-secrets
                  key: mongo-uri
            # JWT
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: bodhganga-secrets
                  key: jwt-secret
            - name: JWT_EXPIRATION
              value: "86400000"
            # AWS S3
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: bodhganga-secrets
                  key: aws-access-key-id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: bodhganga-secrets
                  key: aws-secret-access-key
            - name: AWS_REGION
              value: "ap-south-1"
            - name: AWS_S3_BUCKET
              value: "bodhganga-prod"
            # Razorpay
            - name: RAZORPAY_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: bodhganga-secrets
                  key: razorpay-key-id
                  optional: true
            - name: RAZORPAY_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: bodhganga-secrets
                  key: razorpay-key-secret
                  optional: true
            # Email
            - name: SMTP_HOST
              value: "smtp.gmail.com"
            - name: SMTP_PORT
              value: "587"
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: bodhganga-secrets
                  key: smtp-user
                  optional: true
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: bodhganga-secrets
                  key: smtp-pass
                  optional: true
            # Gemini AI
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: bodhganga-secrets
                  key: gemini-api-key
                  optional: true
            - name: GEMINI_MODEL
              value: "gemini-2.5-flash"
            # CORS
            - name: ALLOWED_ORIGINS
              value: "http://bodhganga-frontend-svc"
            # Google Drive
            - name: GOOGLE_DRIVE_PIPELINE_ENABLED
              value: "false"
            - name: GOOGLE_DRIVE_CREDENTIALS_PATH
              value: "/app/google-credentials.json"
            # Pod identity (useful for log correlation in Grafana)
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # JVM tuning
            - name: JAVA_OPTS
              value: >-
                -XX:+UseContainerSupport
                -XX:MaxRAMPercentage=75.0
                -XX:+ExitOnOutOfMemoryError
                -Djava.security.egd=file:/dev/./urandom

          # ── Resource Requests & Limits ───────────────────────────────────
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1536Mi"   # Slightly higher for S3/Drive/Gemini calls

          # ── Liveness Probe ────────────────────────────────────────────────
          # Kubernetes RESTARTS the pod if this fails 3x.
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: app
            initialDelaySeconds: 60    # Java + Spring Security startup time
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          # ── Readiness Probe ───────────────────────────────────────────────
          # Kubernetes stops routing traffic if this fails.
          # Pod is only Ready when MongoDB connection is also healthy.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: app
            initialDelaySeconds: 45
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          # ── Startup Probe ─────────────────────────────────────────────────
          # Gives the app up to 2 minutes to start without false-positive kills.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: app
            failureThreshold: 12
            periodSeconds: 10

          # ── Volume Mounts ────────────────────────────────────────────────
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # Google credentials (mounted from Secret as a file)
            - name: google-credentials
              mountPath: /app/google-credentials.json
              subPath: google-credentials.json
              readOnly: true

      volumes:
        - name: tmp
          emptyDir: {}
        - name: google-credentials
          secret:
            secretName: bodhganga-secrets
            items:
              - key: google-credentials-json
                path: google-credentials.json
            optional: true

---
##############################################################################
#  BodhGanga Frontend Deployment
#  React (Vite) served by Nginx – single-page app
##############################################################################
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bodhganga-frontend
  namespace: bodhganga
  labels:
    app.kubernetes.io/name: bodhganga-frontend
    app.kubernetes.io/part-of: cloudpulse
    app.kubernetes.io/component: frontend
spec:
  replicas: 2   # Frontend is stateless; 2 replicas sufficient
  selector:
    matchLabels:
      app.kubernetes.io/name: bodhganga-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bodhganga-frontend
        app.kubernetes.io/part-of: cloudpulse
        app.kubernetes.io/component: frontend
    spec:
      securityContext:
        runAsNonRoot: false   # Nginx requires root to bind port 80
      terminationGracePeriodSeconds: 15
      containers:
        - name: bodhganga-frontend
          image: bodhganga-frontend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

---
##############################################################################
#  MongoDB StatefulSet
#  Persistent, stable pod identity required for MongoDB.
#  In production, prefer MongoDB Atlas or a managed service.
##############################################################################
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bodhganga-mongodb
  namespace: bodhganga
  labels:
    app.kubernetes.io/name: bodhganga-mongodb
    app.kubernetes.io/part-of: cloudpulse
    app.kubernetes.io/component: database
spec:
  serviceName: "bodhganga-mongodb"
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bodhganga-mongodb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bodhganga-mongodb
        app.kubernetes.io/part-of: cloudpulse
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: mongodb
          image: mongo:7.0
          ports:
            - containerPort: 27017
              name: mongodb
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: bodhganga-secrets
                  key: mongo-root-user
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bodhganga-secrets
                  key: mongo-root-pass
            - name: MONGO_INITDB_DATABASE
              value: bodhganga
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            exec:
              command: ["mongosh", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["mongosh", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
  volumeClaimTemplates:
    - metadata:
        name: mongo-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
