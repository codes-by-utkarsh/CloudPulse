apiVersion: apps/v1
kind: Deployment
metadata:
  name: bodhganga-backend
  namespace: bodhganga
  labels:
    app.kubernetes.io/name: bodhganga-backend
    app.kubernetes.io/part-of: cloudpulse
    app.kubernetes.io/component: backend
    version: "1.0.0"
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
    prometheus.io/path: "/actuator/prometheus"
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: bodhganga-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bodhganga-backend
        app.kubernetes.io/part-of: cloudpulse
        app.kubernetes.io/component: backend
        version: "1.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: bodhganga-backend
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      terminationGracePeriodSeconds: 30
      containers:
        - name: bodhganga-backend
          image: bodhganga-backend:1.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: app
              containerPort: 9090
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: ENVIRONMENT
              value: "production"
            - name: PORT
              value: "9090"
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: bodhganga-secrets
                  key: mongo-uri
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: bodhganga-secrets
                  key: jwt-secret
            - name: JWT_EXPIRATION
              value: "86400000"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: bodhganga-secrets
                  key: aws-access-key-id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: bodhganga-secrets
                  key: aws-secret-access-key
            - name: AWS_REGION
              value: "ap-south-1"
            - name: AWS_S3_BUCKET
              value: "bodhganga-prod"
            - name: RAZORPAY_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: bodhganga-secrets
                  key: razorpay-key-id
                  optional: true
            - name: RAZORPAY_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: bodhganga-secrets
                  key: razorpay-key-secret
                  optional: true
            - name: SMTP_HOST
              value: "smtp.gmail.com"
            - name: SMTP_PORT
              value: "587"
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: bodhganga-secrets
                  key: smtp-user
                  optional: true
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: bodhganga-secrets
                  key: smtp-pass
                  optional: true
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: bodhganga-secrets
                  key: gemini-api-key
                  optional: true
            - name: GEMINI_MODEL
              value: "gemini-2.5-flash"
            - name: ALLOWED_ORIGINS
              value: "http://bodhganga-frontend-svc"
            - name: GOOGLE_DRIVE_PIPELINE_ENABLED
              value: "false"
            - name: GOOGLE_DRIVE_CREDENTIALS_PATH
              value: "/app/google-credentials.json"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: JAVA_OPTS
              value: >-
                -XX:+UseContainerSupport
                -XX:MaxRAMPercentage=75.0
                -XX:+ExitOnOutOfMemoryError
                -Djava.security.egd=file:/dev/./urandom
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1536Mi"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: app
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: app
            initialDelaySeconds: 45
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: app
            failureThreshold: 12
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: google-credentials
              mountPath: /app/google-credentials.json
              subPath: google-credentials.json
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: google-credentials
          secret:
            secretName: bodhganga-secrets
            items:
              - key: google-credentials-json
                path: google-credentials.json
            optional: true

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bodhganga-frontend
  namespace: bodhganga
  labels:
    app.kubernetes.io/name: bodhganga-frontend
    app.kubernetes.io/part-of: cloudpulse
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: bodhganga-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bodhganga-frontend
        app.kubernetes.io/part-of: cloudpulse
        app.kubernetes.io/component: frontend
    spec:
      securityContext:
        runAsNonRoot: false
      terminationGracePeriodSeconds: 15
      containers:
        - name: bodhganga-frontend
          image: bodhganga-frontend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bodhganga-mongodb
  namespace: bodhganga
  labels:
    app.kubernetes.io/name: bodhganga-mongodb
    app.kubernetes.io/part-of: cloudpulse
    app.kubernetes.io/component: database
spec:
  serviceName: "bodhganga-mongodb"
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bodhganga-mongodb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bodhganga-mongodb
        app.kubernetes.io/part-of: cloudpulse
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: mongodb
          image: mongo:7.0
          ports:
            - containerPort: 27017
              name: mongodb
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: bodhganga-secrets
                  key: mongo-root-user
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bodhganga-secrets
                  key: mongo-root-pass
            - name: MONGO_INITDB_DATABASE
              value: bodhganga
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            exec:
              command: ["mongosh", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["mongosh", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
  volumeClaimTemplates:
    - metadata:
        name: mongo-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
