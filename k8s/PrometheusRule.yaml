apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: bodhganga-alerts
  namespace: bodhganga
  labels:
    release: cloudpulse-prometheus
    app.kubernetes.io/name: bodhganga-backend
    app.kubernetes.io/part-of: cloudpulse
    role: alert-rules
spec:
  groups:
    - name: bodhganga.availability
      interval: 30s
      rules:
        - alert: BodhGangaTargetDown
          expr: |
            up{job="bodhganga-backend-svc", namespace="bodhganga"} == 0
          for: 1m
          labels:
            severity: critical
            team: platform
            service: bodhganga-backend
          annotations:
            summary: "BodhGanga backend pod is DOWN"
            description: >-
              Pod {{ $labels.pod }} in namespace {{ $labels.namespace }}
              has been unreachable for > 1 minute.
              Check: kubectl describe pod {{ $labels.pod }} -n bodhganga

        - alert: BodhGangaReplicasMissing
          expr: |
            kube_deployment_status_replicas_ready{
              deployment="bodhganga-backend",
              namespace="bodhganga"
            } < 3
          for: 2m
          labels:
            severity: warning
            team: platform
            service: bodhganga-backend
          annotations:
            summary: "BodhGanga backend replicas degraded"
            description: >-
              Expected 3 ready replicas but found {{ $value }}.

        - alert: BodhGangaHighErrorRate
          expr: |
            (
              sum(rate(http_server_requests_seconds_count{
                namespace="bodhganga",
                status=~"5.."
              }[5m]))
              /
              sum(rate(http_server_requests_seconds_count{
                namespace="bodhganga"
              }[5m]))
            ) > 0.05
          for: 5m
          labels:
            severity: critical
            team: platform
            service: bodhganga-backend
          annotations:
            summary: "BodhGanga error rate > 5%"
            description: >-
              HTTP 5xx error rate is {{ $value | humanizePercentage }} over the last 5 minutes.

        - alert: BodhGangaHighLatency
          expr: |
            histogram_quantile(0.99,
              sum(rate(http_server_requests_seconds_bucket{
                namespace="bodhganga"
              }[5m])) by (le, uri)
            ) > 2
          for: 5m
          labels:
            severity: warning
            team: platform
            service: bodhganga-backend
          annotations:
            summary: "BodhGanga p99 API latency > 2s"
            description: >-
              99th percentile latency for {{ $labels.uri }} is {{ $value | humanizeDuration }}.

        - alert: BodhGangaAuthFailureSpike
          expr: |
            sum(rate(http_server_requests_seconds_count{
              namespace="bodhganga",
              status="401"
            }[5m])) > 10
          for: 3m
          labels:
            severity: warning
            team: platform
            service: bodhganga-backend
          annotations:
            summary: "BodhGanga 401 Unauthorized spike"
            description: >-
              More than 10 unauthorized requests/sec. Possible JWT misconfiguration or brute-force.

    - name: node.health
      interval: 60s
      rules:
        - alert: HighNodeCpuUsage
          expr: |
            (
              1 - avg by(instance)(
                rate(node_cpu_seconds_total{mode="idle"}[5m])
              )
            ) * 100 > 80
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "Node CPU usage > 80%"
            description: >-
              Node {{ $labels.instance }} CPU is {{ $value | humanize }}%.

        - alert: HighNodeMemoryUsage
          expr: |
            (
              1 - (
                node_memory_MemAvailable_bytes /
                node_memory_MemTotal_bytes
              )
            ) * 100 > 85
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "Node memory usage > 85%"
            description: >-
              Node {{ $labels.instance }} memory is {{ $value | humanize }}%.

        - alert: LowDiskSpace
          expr: |
            (
              node_filesystem_avail_bytes{fstype!~"tmpfs|fuse.lxcfs"} /
              node_filesystem_size_bytes{fstype!~"tmpfs|fuse.lxcfs"}
            ) * 100 < 15
          for: 10m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "Low disk space on {{ $labels.instance }}"
            description: >-
              Mountpoint {{ $labels.mountpoint }} has {{ $value | humanize }}% free.

    - name: bodhganga.jvm
      interval: 60s
      rules:
        - alert: BodhGangaJvmHeapHigh
          expr: |
            (
              jvm_memory_used_bytes{
                namespace="bodhganga",
                area="heap"
              } /
              jvm_memory_max_bytes{
                namespace="bodhganga",
                area="heap"
              }
            ) * 100 > 85
          for: 5m
          labels:
            severity: warning
            team: platform
            service: bodhganga-backend
          annotations:
            summary: "BodhGanga JVM heap > 85%"
            description: >-
              Pod {{ $labels.pod }} heap is {{ $value | humanize }}%.

        - alert: BodhGangaMongoPoolExhausted
          expr: |
            mongodb_driver_pool_waitqueuesize{namespace="bodhganga"} > 5
          for: 3m
          labels:
            severity: warning
            team: platform
            service: bodhganga-backend
          annotations:
            summary: "MongoDB connection pool wait queue growing"
            description: >-
              {{ $value }} threads waiting for a MongoDB connection.
