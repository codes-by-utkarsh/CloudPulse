##############################################################################
#  CloudPulse – PrometheusRule (Alerting Rules)
#
#  Defines SRE-grade alert rules for the BodhGanga workload.
#  The Prometheus Operator loads this resource automatically.
##############################################################################
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: bodhganga-alerts
  namespace: bodhganga
  labels:
    # Must match the Prometheus ruleSelector; kube-prometheus-stack default:
    release: cloudpulse-prometheus
    app.kubernetes.io/name: bodhganga
    app.kubernetes.io/part-of: cloudpulse
    role: alert-rules
spec:
  groups:

    # ─────────────────────────────────────────────────────────────────────────
    # Group 1: BodhGanga Availability / Uptime
    # ─────────────────────────────────────────────────────────────────────────
    - name: bodhganga.availability
      interval: 30s
      rules:

        # ── Alert 1: TargetDown ──────────────────────────────────────────────
        # Fires if ANY BodhGanga pod disappears from Prometheus' target list
        # for more than 1 minute.  Possible causes: OOMKill, crash loop,
        # failed readiness probe, eviction.
        - alert: BodhGangaTargetDown
          expr: |
            up{job="bodhganga-svc", namespace="bodhganga"} == 0
          for: 1m
          labels:
            severity: critical
            team: platform
            service: bodhganga
          annotations:
            summary: "🔴 BodhGanga pod is DOWN"
            description: >-
              BodhGanga pod {{ $labels.pod }} in namespace {{ $labels.namespace }}
              has been unreachable for more than 1 minute.
              Prometheus target: {{ $labels.instance }}.
              Investigate with: kubectl describe pod {{ $labels.pod }} -n bodhganga
            runbook_url: "https://github.com/your-org/cloudpulse/wiki/Runbook-TargetDown"
            dashboard_url: "http://grafana.cloudpulse.internal/d/spring-boot"

        # ── Alert 2: BodhGanga Service Degraded (< 3 pods Ready) ────────────
        - alert: BodhGangaReplicasMissing
          expr: |
            kube_deployment_status_replicas_ready{
              deployment="bodhganga",
              namespace="bodhganga"
            } < 3
          for: 2m
          labels:
            severity: warning
            team: platform
            service: bodhganga
          annotations:
            summary: "⚠️ BodhGanga replica count degraded"
            description: >-
              Expected 3 ready replicas for deployment bodhganga but found
              {{ $value }}.  The service may have reduced capacity.
            runbook_url: "https://github.com/your-org/cloudpulse/wiki/Runbook-ReplicasMissing"

        # ── Alert 3: High HTTP Error Rate (5xx) ─────────────────────────────
        - alert: BodhGangaHighErrorRate
          expr: |
            (
              sum(rate(http_server_requests_seconds_count{
                namespace="bodhganga",
                status=~"5.."
              }[5m]))
              /
              sum(rate(http_server_requests_seconds_count{
                namespace="bodhganga"
              }[5m]))
            ) > 0.05
          for: 5m
          labels:
            severity: critical
            team: platform
            service: bodhganga
          annotations:
            summary: "🔴 BodhGanga error rate > 5%"
            description: >-
              HTTP 5xx error rate is {{ $value | humanizePercentage }} over the
              last 5 minutes.  SLO breach imminent.
            runbook_url: "https://github.com/your-org/cloudpulse/wiki/Runbook-HighErrorRate"

        # ── Alert 4: High Latency (p99 > 2s) ────────────────────────────────
        - alert: BodhGangaHighLatency
          expr: |
            histogram_quantile(0.99,
              sum(rate(http_server_requests_seconds_bucket{
                namespace="bodhganga"
              }[5m])) by (le, uri)
            ) > 2
          for: 5m
          labels:
            severity: warning
            team: platform
            service: bodhganga
          annotations:
            summary: "⚠️ BodhGanga p99 latency > 2s"
            description: >-
              99th percentile latency for {{ $labels.uri }} is
              {{ $value | humanizeDuration }}.

    # ─────────────────────────────────────────────────────────────────────────
    # Group 2: Node / Infrastructure Health
    # ─────────────────────────────────────────────────────────────────────────
    - name: node.health
      interval: 60s
      rules:

        # ── Alert 5: HighCpuUsage ────────────────────────────────────────────
        # Node-level CPU utilisation above 80% for 5 minutes.
        - alert: HighNodeCpuUsage
          expr: |
            (
              1 - avg by(instance)(
                rate(node_cpu_seconds_total{mode="idle"}[5m])
              )
            ) * 100 > 80
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "⚠️ Node CPU usage > 80%"
            description: >-
              Node {{ $labels.instance }} CPU usage is {{ $value | humanize }}%.
              Check for noisy-neighbour pods or consider scaling the node pool.
            runbook_url: "https://github.com/your-org/cloudpulse/wiki/Runbook-HighCPU"

        # ── Alert 6: High Memory Pressure ───────────────────────────────────
        - alert: HighNodeMemoryUsage
          expr: |
            (
              1 - (
                node_memory_MemAvailable_bytes /
                node_memory_MemTotal_bytes
              )
            ) * 100 > 85
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "⚠️ Node memory usage > 85%"
            description: >-
              Node {{ $labels.instance }} memory usage is {{ $value | humanize }}%.

        # ── Alert 7: Disk Space Low ──────────────────────────────────────────
        - alert: LowDiskSpace
          expr: |
            (
              node_filesystem_avail_bytes{fstype!~"tmpfs|fuse.lxcfs"} /
              node_filesystem_size_bytes{fstype!~"tmpfs|fuse.lxcfs"}
            ) * 100 < 15
          for: 10m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "⚠️ Disk space < 15% on {{ $labels.instance }}"
            description: >-
              Mountpoint {{ $labels.mountpoint }} on {{ $labels.instance }}
              has only {{ $value | humanize }}% free space remaining.

    # ─────────────────────────────────────────────────────────────────────────
    # Group 3: JVM Health (BodhGanga-specific)
    # ─────────────────────────────────────────────────────────────────────────
    - name: bodhganga.jvm
      interval: 60s
      rules:

        # ── Alert 8: JVM Heap Near Limit ────────────────────────────────────
        - alert: BodhGangaJvmHeapHigh
          expr: |
            (
              jvm_memory_used_bytes{
                namespace="bodhganga",
                area="heap"
              } /
              jvm_memory_max_bytes{
                namespace="bodhganga",
                area="heap"
              }
            ) * 100 > 85
          for: 5m
          labels:
            severity: warning
            team: platform
            service: bodhganga
          annotations:
            summary: "⚠️ BodhGanga JVM heap > 85%"
            description: >-
              Pod {{ $labels.pod }} heap usage is {{ $value | humanize }}%.
              Risk of OOMKill if this trend continues.
