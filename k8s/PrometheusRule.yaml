##############################################################################
#  CloudPulse – PrometheusRule for BodhGanga
#
#  Updated to match real app structure:
#   - job name: "bodhganga-backend-svc"  (matches ServiceMonitor)
#   - app port: 9090 (single port)
#   - MongoDB health tracked via Spring Actuator composite health
#   - JWT/Security failure rate alert added
##############################################################################
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: bodhganga-alerts
  namespace: bodhganga
  labels:
    release: cloudpulse-prometheus
    app.kubernetes.io/name: bodhganga-backend
    app.kubernetes.io/part-of: cloudpulse
    role: alert-rules
spec:
  groups:

    # ─────────────────────────────────────────────────────────────────────────
    # Group 1: BodhGanga Backend Availability
    # ─────────────────────────────────────────────────────────────────────────
    - name: bodhganga.availability
      interval: 30s
      rules:

        # ── Alert 1: TargetDown ──────────────────────────────────────────────
        # Fires if any backend pod disappears from Prometheus' target list.
        # Common causes: OOMKill, crash loop, failed readiness probe, eviction.
        - alert: BodhGangaTargetDown
          expr: |
            up{job="bodhganga-backend-svc", namespace="bodhganga"} == 0
          for: 1m
          labels:
            severity: critical
            team: platform
            service: bodhganga-backend
          annotations:
            summary: "🔴 BodhGanga backend pod is DOWN"
            description: >-
              BodhGanga backend pod {{ $labels.pod }} in namespace {{ $labels.namespace }}
              has been unreachable for > 1 minute.
              Check: kubectl describe pod {{ $labels.pod }} -n bodhganga
            runbook_url: "https://github.com/your-org/cloudpulse/wiki/Runbook-TargetDown"

        # ── Alert 2: Replica count degraded ─────────────────────────────────
        - alert: BodhGangaReplicasMissing
          expr: |
            kube_deployment_status_replicas_ready{
              deployment="bodhganga-backend",
              namespace="bodhganga"
            } < 3
          for: 2m
          labels:
            severity: warning
            team: platform
            service: bodhganga-backend
          annotations:
            summary: "⚠️ BodhGanga backend replicas degraded"
            description: >-
              Expected 3 ready replicas but found {{ $value }}.
              Service is running with reduced capacity.

        # ── Alert 3: High HTTP 5xx Error Rate ───────────────────────────────
        - alert: BodhGangaHighErrorRate
          expr: |
            (
              sum(rate(http_server_requests_seconds_count{
                namespace="bodhganga",
                status=~"5.."
              }[5m]))
              /
              sum(rate(http_server_requests_seconds_count{
                namespace="bodhganga"
              }[5m]))
            ) > 0.05
          for: 5m
          labels:
            severity: critical
            team: platform
            service: bodhganga-backend
          annotations:
            summary: "🔴 BodhGanga error rate > 5%"
            description: >-
              HTTP 5xx error rate is {{ $value | humanizePercentage }} over
              the last 5 minutes. SLO breach imminent.

        # ── Alert 4: High API Latency (p99 > 2s) ────────────────────────────
        - alert: BodhGangaHighLatency
          expr: |
            histogram_quantile(0.99,
              sum(rate(http_server_requests_seconds_bucket{
                namespace="bodhganga"
              }[5m])) by (le, uri)
            ) > 2
          for: 5m
          labels:
            severity: warning
            team: platform
            service: bodhganga-backend
          annotations:
            summary: "⚠️ BodhGanga p99 API latency > 2s"
            description: >-
              99th percentile latency for {{ $labels.uri }} is
              {{ $value | humanizeDuration }}.

        # ── Alert 5: Auth Failures Spike (Security / JWT issues) ────────────
        - alert: BodhGangaAuthFailureSpike
          expr: |
            sum(rate(http_server_requests_seconds_count{
              namespace="bodhganga",
              status="401"
            }[5m])) > 10
          for: 3m
          labels:
            severity: warning
            team: platform
            service: bodhganga-backend
          annotations:
            summary: "⚠️ BodhGanga 401 Unauthorized spike"
            description: >-
              More than 10 unauthorized requests/sec in the last 5 minutes.
              Possible JWT misconfiguration or brute-force attempt.

    # ─────────────────────────────────────────────────────────────────────────
    # Group 2: Node / Infrastructure Health
    # ─────────────────────────────────────────────────────────────────────────
    - name: node.health
      interval: 60s
      rules:

        # ── Alert 6: HighCpuUsage ────────────────────────────────────────────
        - alert: HighNodeCpuUsage
          expr: |
            (
              1 - avg by(instance)(
                rate(node_cpu_seconds_total{mode="idle"}[5m])
              )
            ) * 100 > 80
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "⚠️ Node CPU usage > 80%"
            description: >-
              Node {{ $labels.instance }} CPU is {{ $value | humanize }}%.
              Check for resource-hungry pods: kubectl top pods -n bodhganga

        # ── Alert 7: High Memory Usage ───────────────────────────────────────
        - alert: HighNodeMemoryUsage
          expr: |
            (
              1 - (
                node_memory_MemAvailable_bytes /
                node_memory_MemTotal_bytes
              )
            ) * 100 > 85
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "⚠️ Node memory usage > 85%"
            description: >-
              Node {{ $labels.instance }} memory is {{ $value | humanize }}%.

        # ── Alert 8: Low Disk Space ──────────────────────────────────────────
        # Important: MongoDB and S3-sync volumes can grow quickly.
        - alert: LowDiskSpace
          expr: |
            (
              node_filesystem_avail_bytes{fstype!~"tmpfs|fuse.lxcfs"} /
              node_filesystem_size_bytes{fstype!~"tmpfs|fuse.lxcfs"}
            ) * 100 < 15
          for: 10m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "⚠️ Low disk space on {{ $labels.instance }}"
            description: >-
              Mountpoint {{ $labels.mountpoint }} has only
              {{ $value | humanize }}% free. MongoDB data volume at risk.

    # ─────────────────────────────────────────────────────────────────────────
    # Group 3: JVM Health (BodhGanga Backend specific)
    # ─────────────────────────────────────────────────────────────────────────
    - name: bodhganga.jvm
      interval: 60s
      rules:

        # ── Alert 9: JVM Heap Near Limit ─────────────────────────────────────
        # With S3/GDrive/Gemini operations, heap spikes are common.
        - alert: BodhGangaJvmHeapHigh
          expr: |
            (
              jvm_memory_used_bytes{
                namespace="bodhganga",
                area="heap"
              } /
              jvm_memory_max_bytes{
                namespace="bodhganga",
                area="heap"
              }
            ) * 100 > 85
          for: 5m
          labels:
            severity: warning
            team: platform
            service: bodhganga-backend
          annotations:
            summary: "⚠️ BodhGanga JVM heap > 85%"
            description: >-
              Pod {{ $labels.pod }} heap is {{ $value | humanize }}%.
              Risk of OOMKill — check for large S3 or Drive payload processing.

        # ── Alert 10: MongoDB Connection Pool Exhausted ──────────────────────
        - alert: BodhGangaMongoPoolExhausted
          expr: |
            mongodb_driver_pool_waitqueuesize{namespace="bodhganga"} > 5
          for: 3m
          labels:
            severity: warning
            team: platform
            service: bodhganga-backend
          annotations:
            summary: "⚠️ MongoDB connection pool wait queue growing"
            description: >-
              {{ $value }} threads waiting for a MongoDB connection.
              Consider increasing spring.data.mongodb.pool.max-size.
