apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: bodhganga-alertmanager-config
  namespace: bodhganga
  labels:
    release: cloudpulse-prometheus
    app.kubernetes.io/name: bodhganga
    app.kubernetes.io/part-of: cloudpulse
spec:
  route:
    groupBy: ["alertname", "namespace", "severity"]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
    receiver: discord-critical
    routes:
      - receiver: discord-critical
        matchers:
          - name: severity
            value: critical
        groupWait: 10s
      - receiver: discord-warning
        matchers:
          - name: severity
            value: warning

  receivers:
    - name: discord-critical
      webhookConfigs:
        - url: "https://discord.com/api/webhooks/REPLACE_WITH_YOUR_CRITICAL_WEBHOOK_URL"
          sendResolved: true

    - name: discord-warning
      webhookConfigs:
        - url: "https://discord.com/api/webhooks/REPLACE_WITH_YOUR_WARNING_WEBHOOK_URL"
          sendResolved: true

  inhibitRules:
    - sourceMatch:
        - name: severity
          value: critical
      targetMatch:
        - name: severity
          value: warning
      equal: ["alertname", "namespace", "service"]
