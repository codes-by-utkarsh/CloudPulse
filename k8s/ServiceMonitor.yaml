##############################################################################
#  CloudPulse – Prometheus ServiceMonitor for BodhGanga Backend
#
#  Tells the Prometheus Operator to scrape /actuator/prometheus
#  from bodhganga-backend-svc on port 9090 every 30 seconds.
#
#  IMPORTANT: BodhGanga uses a single port (9090) for both app traffic
#  and the Prometheus metrics endpoint — the ServiceMonitor targets
#  the 'app' port which maps to :9090/actuator/prometheus.
##############################################################################
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: bodhganga-backend-monitor
  namespace: bodhganga
  labels:
    release: cloudpulse-prometheus
    app.kubernetes.io/name: bodhganga-backend
    app.kubernetes.io/part-of: cloudpulse
spec:
  namespaceSelector:
    matchNames:
      - bodhganga

  selector:
    matchLabels:
      app.kubernetes.io/name: bodhganga-backend

  endpoints:
    - port: app                         # Matches Service port name 'app' → :9090
      path: /actuator/prometheus
      scheme: http
      interval: 30s
      scrapeTimeout: 10s

      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: namespace
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
        - sourceLabels: [__meta_kubernetes_service_name]
          targetLabel: service

      metricRelabelings:
        # Drop noisy high-cardinality buckets we don't need long-term
        - sourceLabels: [__name__]
          regex: "jvm_gc_pause_seconds_bucket|jvm_buffer_.*"
          action: drop
