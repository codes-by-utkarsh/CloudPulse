apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: bodhganga-backend-monitor
  namespace: bodhganga
  labels:
    release: cloudpulse-prometheus
    app.kubernetes.io/name: bodhganga-backend
    app.kubernetes.io/part-of: cloudpulse
spec:
  namespaceSelector:
    matchNames:
      - bodhganga
  selector:
    matchLabels:
      app.kubernetes.io/name: bodhganga-backend
  endpoints:
    - port: app
      path: /actuator/prometheus
      scheme: http
      interval: 30s
      scrapeTimeout: 10s
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: namespace
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
        - sourceLabels: [__meta_kubernetes_service_name]
          targetLabel: service
      metricRelabelings:
        - sourceLabels: [__name__]
          regex: "jvm_gc_pause_seconds_bucket|jvm_buffer_.*"
          action: drop
