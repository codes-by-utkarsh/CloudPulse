##############################################################################
#  CloudPulse – Kubernetes Secret for BodhGanga
#
#  HOW TO USE:
#    1. Base64-encode each real value:
#         echo -n 'your-value' | base64
#    2. Replace the placeholder values below.
#    3. NEVER commit a populated Secret to Git — use Sealed Secrets,
#       External Secrets Operator, or a Vault integration in production.
#
#  Apply with:
#    kubectl apply -f k8s/Secret.yaml -n bodhganga
##############################################################################
apiVersion: v1
kind: Secret
metadata:
  name: bodhganga-secrets
  namespace: bodhganga
  labels:
    app.kubernetes.io/name: bodhganga
    app.kubernetes.io/part-of: cloudpulse
type: Opaque
data:
  # MongoDB
  # echo -n 'admin' | base64  → YWRtaW4=
  mongo-root-user: YWRtaW4=
  # echo -n 'CHANGE_THIS_STRONG_PASSWORD' | base64
  mongo-root-pass: Q0hBTkdFX1RISVNfU1RST05HX1BBU1NXT1JE
  # Full connection string:
  # echo -n 'mongodb://admin:CHANGE_THIS@bodhganga-mongodb:27017/bodhganga?authSource=admin' | base64
  mongo-uri: bW9uZ29kYjovL2FkbWluOkNIQU5HRV9USElTX1NUUk9OR19QQVNTV09SREBib2RoZ2FuZ2EtbW9uZ29kYjoyNzAxNy9ib2RoZ2FuZ2E/YXV0aFNvdXJjZT1hZG1pbg==

  # JWT Secret (min 64 chars)
  # openssl rand -base64 64 | tr -d '\n' | base64
  jwt-secret: UkVQTEFDRV9XSVRIX1NUUk9OR182NF9DSEFSX1NFQ1JFVF9rZXk=

  # AWS S3
  aws-access-key-id: QUNLSUFJT1NGT0ROTjdFWEFNUExF
  aws-secret-access-key: d0phbHJYVXRuRkVNSS9LN01ERU5HL2JQeFJmaUNZRVhBTVBMRUtFWQ==

  # Razorpay (optional)
  razorpay-key-id: ""
  razorpay-key-secret: ""

  # Email SMTP (optional)
  smtp-user: ""
  smtp-pass: ""

  # Gemini AI (optional)
  gemini-api-key: ""

  # Google Drive credentials JSON (optional – base64 of the entire JSON file)
  # cat google-credentials.json | base64 -w 0
  google-credentials-json: ""
