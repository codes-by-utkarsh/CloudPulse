##############################################################################
#  CloudPulse – Helm Values Override for kube-prometheus-stack
#
#  Reference:
#    helm install cloudpulse-prometheus prometheus-community/kube-prometheus-stack \
#      --namespace monitoring \
#      --create-namespace \
#      --values helm/prometheus-values.yaml
##############################################################################

# ── Cluster name tag ──────────────────────────────────────────────────────────
fullnameOverride: "cloudpulse"
nameOverride: "cloudpulse"

# ── Global settings ───────────────────────────────────────────────────────────
global:
  rbac:
    create: true

# ── Prometheus Operator ───────────────────────────────────────────────────────
prometheusOperator:
  enabled: true
  admissionWebhooks:
    enabled: true
    failurePolicy: Fail

# ── Prometheus ────────────────────────────────────────────────────────────────
prometheus:
  enabled: true
  prometheusSpec:
    # Pick up ALL ServiceMonitors and PrometheusRules across all namespaces
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

    # Retention: keep 30 days of metrics in persistent storage
    retention: 30d
    retentionSize: "10GB"

    # Persistent storage for Prometheus data
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 15Gi

    # Resource limits for the Prometheus pod itself
    resources:
      requests:
        cpu: "200m"
        memory: "512Mi"
      limits:
        cpu: "1000m"
        memory: "2Gi"

    # Scrape interval (must be >= ServiceMonitor interval)
    scrapeInterval: "30s"
    evaluationInterval: "30s"

    # External labels attached to every metric/alert sent out of this cluster
    externalLabels:
      cluster: cloudpulse-local
      environment: production

# ── Alertmanager ──────────────────────────────────────────────────────────────
alertmanager:
  enabled: true
  alertmanagerSpec:
    # Route: Alertmanager will also read AlertmanagerConfig CRDs
    alertmanagerConfigSelector:
      matchLabels:
        release: cloudpulse-prometheus

    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "200m"
        memory: "256Mi"

    storage:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi

# ── Grafana ───────────────────────────────────────────────────────────────────
grafana:
  enabled: true
  adminPassword: "CloudPulse@2024!"   # Change in production! Use a Secret.

  # Preload dashboards from the community
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: "default"
          orgId: 1
          folder: "CloudPulse"
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default

  # Auto-import popular dashboards on startup
  dashboards:
    default:
      # JVM (Micrometer) – Dashboard ID: 4701
      jvm-micrometer:
        gnetId: 4701
        revision: 9
        datasource: Prometheus
      # Spring Boot Statistics – Dashboard ID: 12900
      spring-boot:
        gnetId: 12900
        revision: 2
        datasource: Prometheus
      # Kubernetes Cluster Overview – Dashboard ID: 7249
      kubernetes-cluster:
        gnetId: 7249
        revision: 1
        datasource: Prometheus

  persistence:
    enabled: true
    size: 5Gi

  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

  # Grafana sidecar: auto-load ConfigMap-backed dashboards
  sidecar:
    dashboards:
      enabled: true
    datasources:
      enabled: true

# ── Node Exporter (hardware metrics) ─────────────────────────────────────────
nodeExporter:
  enabled: true

# ── kube-state-metrics (Kubernetes object metrics) ───────────────────────────
kubeStateMetrics:
  enabled: true

# ── Default rules (built-in Kubernetes alerting rules) ───────────────────────
defaultRules:
  create: true
  rules:
    alertmanager: true
    etcd: false          # Disable etcd rules for Minikube (no etcd metrics)
    configReloaders: true
    general: true
    k8s: true
    kubeApiserver: true
    kubeApiserverAvailability: true
    kubeApiserverSlos: true
    kubelet: true
    kubeProxy: false     # kube-proxy metrics often unavailable in Minikube
    kubePrometheusGeneral: true
    kubePrometheusNodeRecording: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    kubeScheduler: false # May not be available in Minikube
    node: true
    nodeExporterAlerting: true
    nodeExporterRecording: true
    prometheus: true
    prometheusOperator: true
